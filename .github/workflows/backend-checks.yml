name: Backend checks

on:
  pull_request:
  push:
    branches: ["review/**"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned uv and dependencies
        run: |
          python -m pip install uv==0.13.4
          uv sync --frozen
      - name: Lint and SQLite behavior tests
        run: |
          uv run ruff check
          uv run pytest
      - name: Start isolated PostgreSQL
        run: docker compose -p diplomnavigator-ci-tests -f docker-compose.test.yml up -d --wait
      - name: PostgreSQL migrations and concurrency tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:test-only-password@127.0.0.1:55432/diplom_test
        run: uv run pytest -m postgres --tb=short
      - name: Clean up test database
        if: always()
        run: docker compose -p diplomnavigator-ci-tests -f docker-compose.test.yml down --volumes
