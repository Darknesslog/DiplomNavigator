[project]
name = "diplomnavigator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AbsenttttSavior", email = "thedarknesslog@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.156.2",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
diplomnavigator = "diplomnavigator:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
