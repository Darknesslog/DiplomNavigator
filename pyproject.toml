[project]
name = "diplomnavigator"
version = "0.1.0"
description = "Сервис выбора и распределения тем выпускных работ"
readme = "README.md"
authors = [
    { name = "AbsenttttSavior", email = "thedarknesslog@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16",
    "email-validator>=2.2",
    "fastapi>=0.156.2",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2,bcrypt]>=0.3,<1",
    "pyjwt>=2.10,<3",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# Приложение запускается через uvicorn (app.main:app), а не ставится как пакет.
# Без этой строки uv_build ищет src/diplomnavigator/__init__.py: после перехода
# на layout app/ его нет, и `uv sync` / сборка Docker-образа падают.
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "ISC004", "RUF100"]
