[project]
name = "diplomnavigator"
version = "0.1.0"
description = "Сервис выбора и распределения тем выпускных работ"
readme = "README.md"
authors = [
    { name = "AbsenttttSavior", email = "thedarknesslog@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.156.2",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# Приложение запускается через uvicorn (app.main:app), а не ставится как пакет.
# Без этой строки uv_build ищет src/diplomnavigator/__init__.py: после перехода
# на layout app/ его нет, и `uv sync` / сборка Docker-образа падают.
package = false
